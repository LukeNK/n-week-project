---
layout: base
---

<style>
    body {
        background-color: #1f1f1f;
        padding: 0;
        margin: 0;
    }

    svg {
        display: block;
        margin: auto;
    }

    circle {
        &:not(.background) {
            stroke: #A0B1BA;
            stroke-width: 2;
            fill: #1f1f1faa; /* Make the circle semi-transparent */
            r: 5;
            cursor: pointer;
        }

        &.highlight {
            fill: #A0B1BA;
            r: 10;
        }
        &.prereq {
            fill: #A0B1BA;
            r: 10;
        }
        &.require {
            r: 10;
        }

        &.background {
            fill: none;
            stroke: #A0B1BA50;
            stroke-width: 1;
        }
    }

    text {
        fill: #A0B1BA;
        font-size: 0.75rem;
    }

    line {
        stroke: #A0B1BA;
        stroke-width: 1;

        &:not([class]) {
            stroke: #A0B1BA50;
        }
        &.prereq {
            stroke-width: 2;
        }
        &.require {
            stroke-dasharray: 5, 5;
        }
    }
</style>

<!-- Import data -->
{% for collection in site.collections %}
    {% for page in collection.docs %}
        <data
            subject="{{ collection.name }}"
            chapter="{{ page.url | slice: 1, page.url.size | replace: '/', '-' }}"
            prerequisites="{{ page.prerequisites | join: ',' }}"
            draft="{% if page.layout == 'draft'%}true{% endif%}"
        ></data>
    {% endfor %}
{% endfor %}

<!--
    Each dot represents a chapter, each line represents a prerequisite.
    Unfinished level does not have dot, but still have lines
    the dots make a circle, with the inner circle represents chapter in the lower levels
-->

<svg width="600" height="600">
    <g id="line"></g>
    <g id="text"></g>
    <g id="dot"></g>
</svg>

<script src="{{ site.url }}/level.js"></script>
<script>
    // Split to svg group to make sure the z-index prioritize the dot
    const svg = document.querySelector("svg"),
        svgLine = document.getElementById("line"),
        svgText = document.getElementById("text"),
        svgDot = document.getElementById("dot");

    // make svg take the entire window
    const maxLength = Math.min(window.innerHeight, window.innerWidth) - 10; // Leave some space for text
    svg.setAttribute("width", maxLength);
    svg.setAttribute("height", maxLength);

    // First scan for the maximum level
    let maxLevel = 0;
    for (const id in chapters) {
        const chapter = chapters[id];
        if (chapter.level > maxLevel) {
            maxLevel = chapter.level;
        }
    }

    // Draw background circles for each level
    const levelLength = maxLength / (maxLevel + 1); // The length of each level
    for (let i = 1; i <= maxLevel + 1; i++) {
        let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", 10);
        circle.setAttribute("cy", 10);
        circle.setAttribute("r", i * levelLength);
        circle.classList.add('background');
        svgLine.appendChild(circle);
    }

    // Second scan for each chapter to draw visual
    for (const id in chapters) {
        const chapter = chapters[id];
        let dot = document.createElementNS("http://www.w3.org/2000/svg", "circle"),
            angle = Math.random() / 2 * Math.PI,
            length = maxLength - (chapter.level + 1 - Math.random() * 0.8) * levelLength; // Randomize the position a bit to avoid overlap
        let x = length * Math.cos(angle) + 10,
            y = length * Math.sin(angle) + 10;

        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dot.setAttribute("id", id);
        dot.setAttribute("prerequisites", chapter.prerequisites.join(","));
        dot.setAttribute("onclick", "viewTree(this); viewLeaves(this.id);");
        dot.setAttribute("title", id);
        svgDot.appendChild(dot);

        let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x + 15);
        text.setAttribute("y", y + 2.5);
        text.textContent = id;
        svgText.appendChild(text);
    }

    // Draw lines between two circle
    function drawLine(from, to, type) {
        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", from.getAttribute("cx"));
        line.setAttribute("y1", from.getAttribute("cy"));
        line.setAttribute("x2", to.getAttribute("cx"));
        line.setAttribute("y2", to.getAttribute("cy"));
        line.classList.add(type);
        svgLine.appendChild(line);
    }

    // Show prerequisites
    function viewTree(circle) {
        const prerequisites = circle.getAttribute('prerequisites').split(',');
        circle.classList.add('highlight');

        // Show only the rows that are prerequisites, recursively
        prerequisites.forEach(prereq => {
            const preCircle = document.getElementById(prereq);
            if (preCircle) {
                preCircle.classList.add('prereq');
                drawLine(circle, preCircle, 'prereq');
                viewTree(preCircle);
                viewLeaves(preCircle.id);
            }
        });
    }

    // Show the chapters that require this chapter, recursively
    function viewLeaves(chapterId) {
        document.querySelectorAll(`circle[prerequisites*="${chapterId}"]`).forEach(dot => {
            dot.classList.add('require');
            drawLine(dot, document.getElementById(chapterId), 'require');
            viewLeaves(dot.id);
        });
    }
</script>
